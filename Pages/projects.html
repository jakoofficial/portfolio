<script>
  $.get("../Data/ProjectList.json", function (data) {
    let idx = 0;

    while(idx < data.length){
      var proj = $('<div class="project">');
      var link = $('<a href="'+data[idx].Link+'">',);
      var thumbnail = $('<img src="'+data[idx].Thumbnail+'" alt="" />');
      var title = $('<p class="title">'+data[idx].Title+'</p>');
      var info = $('<p class="info">'+data[idx].Desc+'</p>');

      $("#project_list").append(proj.append(link.append(thumbnail, title, info)));
      idx++;
    };
  });
</script>
